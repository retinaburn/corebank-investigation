name: corebank-tests

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: corebank_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d corebank_test"]
      interval: 2s
      timeout: 5s
      retries: 30
