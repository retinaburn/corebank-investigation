name: corebank-investigation

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: corebank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 uses a version-specific directory beneath this mount.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d corebank"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    stop_grace_period: 30s
    shm_size: 128mb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  core:
    build:
      context: ..
      dockerfile: docker/corebank.Dockerfile
    # Until trigger watching exists, invoke this service with compose run --rm.
    profiles: [batch]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      COREBANK_DB_URL: jdbc:postgresql://postgres:5432/corebank
      COREBANK_DB_USER: postgres
      COREBANK_DB_PASSWORD: ${POSTGRES_PASSWORD}
      COREBANK_INPUT_DIRECTORY: /data/input
      COREBANK_OUTPUT_DIRECTORY: /data/output
      COREBANK_ERROR_DIRECTORY: /data/error
      TZ: UTC
    volumes:
      - ../data/input:/data/input
      - ../data/output:/data/output
      - ../data/error:/data/error
    stop_grace_period: 30s

volumes:
  postgres_data:
